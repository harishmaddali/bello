<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Untangling the thread">
  <style>
    .th-line {
      stroke: var(--bello-ink, #1E2A21); fill: none; stroke-width: 2.8; stroke-linecap: round;
      stroke-dasharray: 58 200;
      animation: th-slide 4.2s cubic-bezier(.6,.1,.4,.95) infinite, th-fade 4.2s linear infinite;
    }
    /* a fixed-length window slides along the path: knots feed in, straight thread comes out */
    @keyframes th-slide { 0%, 14% { stroke-dashoffset: 0; } 64%, 100% { stroke-dashoffset: -42; } }
    @keyframes th-fade { 0%, 86% { opacity: 1; } 94%, 99.9% { opacity: 0; } 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .th-line { animation: none; stroke-dashoffset: -42; }
    }
  </style>
  <path class="th-line" pathLength="100"
        d="M24 62 C28 50 42 48 40 58 C38 67 27 65 31 56 C35 47 48 45 48 55 C48 64 36 68 38 57 C40 47 52 49 53 57 C54 63 58 61.5 63 60.8 C73 59.5 85 59.5 97 60"/>
</svg>
