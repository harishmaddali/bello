<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Folding it neatly">
  <style>
    .or-ink { stroke: var(--bello-ink, #1E2A21); fill: none; stroke-linecap: round; }
    .or-paper { fill: var(--bello-paper, #FCFEFA); stroke: var(--bello-ink, #1E2A21); stroke-width: 2.3; stroke-linejoin: round; }
    .or-f { transform-origin: 60px 58px; opacity: 0; }
    .or-f1 { animation: or-f1 4s linear infinite; }
    .or-f2 { animation: or-f2 4s linear infinite; }
    .or-f3 { animation: or-f3 4s linear infinite; }
    @keyframes or-f1 {
      0%       { opacity: 1; transform: scale(.96); }
      3%       { transform: scale(1); }
      25.9%    { opacity: 1; }
      26%, 100%{ opacity: 0; }
    }
    @keyframes or-f2 {
      0%, 25.9% { opacity: 0; transform: scale(.96); }
      26%       { opacity: 1; }
      29%       { transform: scale(1); }
      51.9%     { opacity: 1; }
      52%, 100% { opacity: 0; }
    }
    @keyframes or-f3 {
      0%, 51.9% { opacity: 0; transform: scale(.96); }
      52%       { opacity: 1; }
      55%       { transform: scale(1); }
      86%       { opacity: 1; }
      95%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .or-f1, .or-f2, .or-f3 { animation: none; }
      .or-f3 { opacity: 1; transform: none; }
    }
  </style>
  <!-- frame 1: flat sheet -->
  <g class="or-f or-f1">
    <path class="or-paper" d="M60 38 C66 43.5 71.5 49.5 76 56 C70 61.5 64.5 67 60 73 C55.5 67 50 61.5 44 56 C48.5 49.5 54 43.5 60 38 Z"/>
    <path class="or-ink" stroke-width="1.6" opacity=".4" d="M60 38 C60 49.5 60 61.5 60 73"/>
    <path class="or-ink" stroke-width="1.6" opacity=".4" d="M44 56 C54.5 56 65.5 56 76 56"/>
  </g>
  <!-- frame 2: half folded -->
  <g class="or-f or-f2">
    <path class="or-paper" d="M44 60 C54 53 66 53 76 60 C70 66.5 65 70 60 73.5 C55 70 50 66.5 44 60 Z"/>
    <path class="or-ink" stroke-width="1.8" opacity=".5" d="M44 60 C54.5 60.5 65.5 60.5 76 60"/>
    <path class="or-ink" stroke-width="1.8" opacity=".5" d="M55 60 C58 56.5 62 56.5 65 60"/>
  </g>
  <!-- frame 3: crane -->
  <g class="or-f or-f3">
    <path class="or-paper" d="M47 64 C53 58 67 58 73 64 C68 68.5 63.5 71 60 73 C56.5 71 52 68.5 47 64 Z"/>
    <path class="or-paper" d="M50 62.5 C47.5 56.5 47 51.5 48.5 46 C50.5 47 52.3 48.6 53.8 51 C53 55 52 59 50 62.5 Z"/>
    <path class="or-ink" stroke-width="2" d="M48.5 46 L44.6 43.4"/>
    <path class="or-paper" d="M70 62.5 C72.5 58 74.5 54.5 75.8 50.5 C72.5 52.5 70 55.5 68.2 59.5 C68.8 60.5 69.4 61.5 70 62.5 Z"/>
    <path class="or-paper" d="M58 60.5 C56.5 54 56.5 47.8 58.5 41.5 C61.5 47 62.5 53 61.5 60 C60.3 60.1 59.1 60.3 58 60.5 Z"/>
    <circle fill="var(--bello-accent, #3E7B4F)" cx="46.7" cy="45.3" r="1.2"/>
  </g>
</svg>
