<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Sending it off">
  <style>
    .pl-ink { stroke: var(--bello-ink, #1E2A21); fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .pl-body { fill: var(--bello-paper, #FCFEFA); stroke: var(--bello-ink, #1E2A21); stroke-width: 2; stroke-linejoin: round; }
  </style>
  <!-- dotted flight trail -->
  <path id="pl-path" class="pl-ink" stroke-width="2.4" opacity=".45" stroke-dasharray="1 8"
        d="M14 74 C38 58 66 72 106 50">
    <animate attributeName="stroke-dashoffset" values="0;36" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <!-- plane -->
  <g>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="3.2s" repeatCount="indefinite"/>
    <animateMotion dur="3.2s" repeatCount="indefinite" rotate="auto" calcMode="linear" keyPoints="0;1" keyTimes="0;1">
      <mpath xlink:href="#pl-path" href="#pl-path"/>
    </animateMotion>
    <g transform="translate(0 -6) scale(1.1)">
      <!-- top wing panel -->
      <path class="pl-body" d="M12 0 C4.5 -1.8 -3.5 -4.2 -11 -6.5 C-8.7 -4.3 -6.6 -2.2 -4.5 -0.2 C1 -0.4 6.8 -0.3 12 0 Z"/>
      <!-- hanging keel fold -->
      <path class="pl-body" d="M12 0 C6 1.3 0.5 0.9 -4.5 -0.2 C-5.8 2.1 -6.9 4.3 -8 6.5 C-1.8 4.6 5 2.2 12 0 Z"/>
    </g>
  </g>
</svg>
