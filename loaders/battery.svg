<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Charging it up">
  <style>
    .ba-ink { stroke: var(--bello-ink, #1E2A21); fill: none; stroke-linecap: round; }
    .ba-bar { fill: var(--bello-accent, #3E7B4F); opacity: .88; transform-box: fill-box; transform-origin: 50% 50%; }
    .ba-b1 { animation: ba-b1 3.4s cubic-bezier(.4,.05,.35,1.2) infinite; }
    .ba-b2 { animation: ba-b2 3.4s cubic-bezier(.4,.05,.35,1.2) infinite; }
    .ba-b3 { animation: ba-b3 3.4s cubic-bezier(.4,.05,.35,1.2) infinite; }
    @keyframes ba-b1 { 0%, 8%  { transform: scale(0); } 16%, 100% { transform: scale(1); } }
    @keyframes ba-b2 { 0%, 26% { transform: scale(0); } 34%, 100% { transform: scale(1); } }
    @keyframes ba-b3 { 0%, 44% { transform: scale(0); } 52%, 100% { transform: scale(1); } }
    .ba-zap { stroke: var(--bello-accent, #3E7B4F); fill: none; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round;
              transform-box: fill-box; transform-origin: 50% 50%; animation: ba-zap 3.4s cubic-bezier(.4,.05,.35,1.2) infinite; }
    @keyframes ba-zap {
      0%, 56%   { transform: scale(0) rotate(-15deg); opacity: 0; }
      63%       { transform: scale(1.2); opacity: 1; }
      68%, 80%  { transform: scale(1); opacity: 1; }
      88%, 100% { transform: scale(.4); opacity: 0; }
    }
    .ba-fade { animation: ba-fade 3.4s linear infinite; }
    @keyframes ba-fade { 0%, 86% { opacity: 1; } 95%, 99.9% { opacity: 0; } 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .ba-b1, .ba-b2, .ba-b3, .ba-zap, .ba-fade { animation: none; }
      .ba-bar { transform: scale(1); }
      .ba-zap { opacity: 0; }
    }
  </style>
  <path class="ba-ink" stroke-width="2.6" stroke-linejoin="round"
        d="M36 50.5 C50 49.4 68 49.4 82 50.5 C83 56.5 83 63.5 82 69.5 C68 70.6 50 70.6 36 69.5 C35 63.5 35 56.5 36 50.5 Z"/>
  <path class="ba-ink" stroke-width="2.4" d="M84.5 56.5 C86.2 56.7 87 57.3 87 58.8 C87 60 87 60.2 87 61.4 C87 62.9 86.2 63.4 84.5 63.6"/>
  <g class="ba-fade">
    <path class="ba-bar ba-b1" d="M40.5 55.5 C43.5 55.2 46.5 55.2 49.5 55.5 C49.9 58.5 49.9 61.5 49.5 64.5 C46.5 64.8 43.5 64.8 40.5 64.5 C40.1 61.5 40.1 58.5 40.5 55.5 Z"/>
    <path class="ba-bar ba-b2" d="M53.5 55.4 C56.5 55.1 59.5 55.1 62.5 55.4 C62.9 58.4 62.9 61.6 62.5 64.6 C59.5 64.9 56.5 64.9 53.5 64.6 C53.1 61.6 53.1 58.4 53.5 55.4 Z"/>
    <path class="ba-bar ba-b3" d="M66.5 55.5 C69.5 55.2 72.5 55.2 75.5 55.5 C75.9 58.5 75.9 61.5 75.5 64.5 C72.5 64.8 69.5 64.8 66.5 64.5 C66.1 61.5 66.1 58.5 66.5 55.5 Z"/>
    <path class="ba-zap" d="M91 30 L86.5 37 L90 37.5 L85 44.5"/>
  </g>
</svg>
