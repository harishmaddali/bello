<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Scanning for it">
  <style>
    .ra-ink { stroke: var(--bello-ink, #1E2A21); fill: none; stroke-linecap: round; }
    .ra-sweep { transform-origin: 60px 60px; animation: ra-turn 3.2s linear infinite; }
    @keyframes ra-turn { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .ra-blip { fill: var(--bello-accent, #3E7B4F); transform-box: fill-box; transform-origin: 50% 50%; }
    .ra-b1 { animation: ra-b1 3.2s ease-out infinite; }
    .ra-b2 { animation: ra-b2 3.2s ease-out infinite; }
    @keyframes ra-b1 {
      0%, 11%  { transform: scale(0); opacity: 0; }
      15%      { transform: scale(1.35); opacity: 1; }
      19%      { transform: scale(1); opacity: 1; }
      38%      { opacity: .85; }
      54%, 100%{ transform: scale(.9); opacity: 0; }
    }
    @keyframes ra-b2 {
      0%, 62%  { transform: scale(0); opacity: 0; }
      66%      { transform: scale(1.35); opacity: 1; }
      70%      { transform: scale(1); opacity: 1; }
      88%      { opacity: .85; }
      99%, 100%{ transform: scale(.9); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ra-sweep, .ra-b1, .ra-b2 { animation: none; }
      .ra-blip { transform: none; opacity: 1; }
    }
  </style>
  <path class="ra-ink" stroke-width="2.8"
        d="M60 34 C74.5 33.6 86.5 45 86 60.5 C85.5 75 73.5 86.4 59 86 C45 85.6 33.8 74 34.2 59 C34.6 45 46 34.4 60 34"/>
  <path class="ra-ink" stroke-width="2" opacity=".3"
        d="M60 45 C68.5 44.8 75.2 51.5 75 60.2 C74.8 68.5 68 75.2 59.6 75 C51.5 74.8 44.9 68 45.1 59.6 C45.3 51.5 51.8 45.2 60 45"/>
  <g class="ra-sweep">
    <path class="ra-ink" stroke-width="5" opacity=".16" d="M44.8 41.8 C49 37.8 54.5 35.8 60 35.9"/>
    <path class="ra-ink" stroke-width="2.6" d="M60 60 C60.5 52 60.2 43 60 35.5"/>
  </g>
  <circle fill="var(--bello-ink, #1E2A21)" cx="60" cy="60" r="2.2"/>
  <circle class="ra-blip ra-b1" cx="72" cy="48" r="2.6"/>
  <circle class="ra-blip ra-b2" cx="47" cy="70" r="2.4"/>
</svg>
