<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Sketching your post">
  <style>
    .n-ink { stroke: var(--bello-ink, #1E2A21); fill: none; stroke-linecap: round; }
    .n-page { fill: var(--bello-paper, #FCFEFA); stroke: var(--bello-ink, #1E2A21); stroke-width: 2.6; stroke-linejoin: round; }
    .n-accent { stroke: var(--bello-accent, #3E7B4F); fill: none; stroke-linecap: round; }
    /* hand-drawn "line boil": two jittered page outlines alternating */
    .n-pageA { animation: n-bA 0.64s steps(1, end) infinite; }
    .n-pageB { animation: n-bB 0.64s steps(1, end) infinite; }
    @keyframes n-bA { 0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes n-bB { 0%, 49.9% { opacity: 0; } 50%, 100% { opacity: 1; } }
    .n-line { stroke-dasharray: 100 150; stroke-dashoffset: 101; }
    .n-l1 { animation: n-l1 3.6s linear infinite; }
    .n-l2 { animation: n-l2 3.6s linear infinite; }
    .n-l3 { animation: n-l3 3.6s linear infinite; }
    @keyframes n-l1 { 0%, 5%  { stroke-dashoffset: 101; } 17%, 100% { stroke-dashoffset: 0; } }
    @keyframes n-l2 { 0%, 26% { stroke-dashoffset: 101; } 40%, 100% { stroke-dashoffset: 0; } }
    @keyframes n-l3 { 0%, 47% { stroke-dashoffset: 101; } 60%, 100% { stroke-dashoffset: 0; } }
    .n-dot { fill: var(--bello-ink, #1E2A21); transform-box: fill-box; transform-origin: 50% 50%; animation: n-dot 3.6s ease-out infinite; }
    @keyframes n-dot {
      0%, 64% { transform: scale(0); opacity: 0; }
      69%     { transform: scale(1.25); opacity: 1; }
      74%, 100% { transform: scale(1); opacity: 1; }
    }
    .n-fade { animation: n-fade 3.6s linear infinite; }
    @keyframes n-fade { 0%, 82% { opacity: 1; } 91%, 99.9% { opacity: 0; } 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .n-pageA, .n-pageB, .n-l1, .n-l2, .n-l3, .n-dot, .n-fade { animation: none; }
      .n-pageB { opacity: 0; }
      .n-line { stroke-dasharray: none; stroke-dashoffset: 0; }
      .n-dot { transform: scale(1); opacity: 1; }
    }
  </style>
  <path class="n-page n-pageA" d="M39 28.5 C52 26.8 68 27.4 81 28.2 C82.6 47 82 66 81.4 89.6 C66 91.2 52 90.8 39.8 90 C38.6 69 38.2 48 39 28.5 Z"/>
  <path class="n-page n-pageB" d="M39.6 27.8 C53 27.6 67 26.9 81.6 28.8 C81.9 48 82.5 67 80.8 90.4 C67 90.3 51 91.4 39.2 89.7 C39.4 68 38.8 47 39.6 27.8 Z"/>
  <g class="n-fade">
    <path class="n-accent n-line n-l1" stroke-width="3.4" pathLength="100" d="M46 40 C54 38.9 64 39.6 73 39.1"/>
    <path class="n-ink n-line n-l2" stroke-width="3" pathLength="100" d="M46 51.5 C56 50.6 66 51.8 74 50.9"/>
    <path class="n-ink n-line n-l3" stroke-width="3" pathLength="100" d="M46 62.5 C55 61.7 64 62.6 72 61.9"/>
    <path class="n-dot" d="M69.6 74.2 C71.4 73.8 72.8 75 72.7 76.7 C72.6 78.4 71 79.5 69.4 79 C67.9 78.5 67.3 76.8 68 75.4 C68.4 74.7 68.9 74.3 69.6 74.2 Z"/>
  </g>
</svg>
