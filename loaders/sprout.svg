<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Growing the idea">
  <style>
    .sp-ink { stroke: var(--bello-ink, #1E2A21); fill: none; stroke-linecap: round; }
    .sp-leaf { fill: var(--bello-paper, #FCFEFA); stroke: var(--bello-ink, #1E2A21); stroke-width: 2.4; stroke-linejoin: round; }
    .sp-stem {
      stroke-dasharray: 100 150; stroke-dashoffset: 101;
      animation: sp-stem 3.8s linear infinite;
    }
    @keyframes sp-stem { 0%, 4% { stroke-dashoffset: 101; } 26%, 100% { stroke-dashoffset: 0; } }
    .sp-l1 { transform-origin: 59.5px 66px; animation: sp-pop1 3.8s cubic-bezier(.4,.05,.35,1.2) infinite; }
    .sp-l2 { transform-origin: 60.3px 55px; animation: sp-pop2 3.8s cubic-bezier(.4,.05,.35,1.2) infinite; }
    @keyframes sp-pop1 { 0%, 27% { transform: scale(0); } 37%, 100% { transform: scale(1); } }
    @keyframes sp-pop2 { 0%, 39% { transform: scale(0); } 49%, 100% { transform: scale(1); } }
    .sp-bud { fill: var(--bello-accent, #3E7B4F); transform-origin: 59.5px 38px; animation: sp-bud 3.8s cubic-bezier(.4,.05,.35,1.3) infinite; }
    @keyframes sp-bud { 0%, 52% { transform: scale(0); } 60%, 100% { transform: scale(1); } }
    .sp-fade { animation: sp-fade 3.8s linear infinite; }
    @keyframes sp-fade { 0%, 84% { opacity: 1; } 93%, 99.9% { opacity: 0; } 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .sp-stem, .sp-l1, .sp-l2, .sp-bud, .sp-fade { animation: none; }
      .sp-stem { stroke-dasharray: none; stroke-dashoffset: 0; }
      .sp-l1, .sp-l2, .sp-bud { transform: scale(1); }
    }
  </style>
  <path class="sp-ink" stroke-width="2.8" d="M44 86 Q60 88.5 76 85.5"/>
  <g class="sp-fade">
    <path class="sp-ink sp-stem" stroke-width="2.8" pathLength="100"
          d="M60 86 C61.5 76 58.5 68 60 58 C61 51 60 46 59.5 41"/>
    <path class="sp-leaf sp-l1" d="M59.5 66 C52 64 46.5 58.5 46 51.5 C53 52.5 58.2 57.5 59.7 64.5 Z"/>
    <path class="sp-leaf sp-l2" d="M60.3 55 C67 53.5 72.5 48.5 73.5 42 C66.5 42.6 61.5 47.5 60.1 53.5 Z"/>
    <path class="sp-bud" d="M59.5 34.8 C61.8 34.6 63.4 36.2 63.3 38.3 C63.2 40.4 61.3 41.9 59.2 41.4 C57.3 40.9 56.3 39 57 37.2 C57.5 35.8 58.4 35 59.5 34.8 Z"/>
  </g>
</svg>
