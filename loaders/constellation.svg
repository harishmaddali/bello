<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Connecting the dots">
  <style>
    .cn-line { stroke: var(--bello-ink, #1E2A21); fill: none; stroke-width: 2; stroke-linecap: round; opacity: .65;
               stroke-dasharray: 100 150; stroke-dashoffset: 101; }
    .cn-ab { animation: cn-ab 4.4s linear infinite; }
    .cn-bc { animation: cn-bc 4.4s linear infinite; }
    .cn-cd { animation: cn-cd 4.4s linear infinite; }
    .cn-de { animation: cn-de 4.4s linear infinite; }
    @keyframes cn-ab { 0%, 34% { stroke-dashoffset: 101; } 44%, 100% { stroke-dashoffset: 0; } }
    @keyframes cn-bc { 0%, 44% { stroke-dashoffset: 101; } 54%, 100% { stroke-dashoffset: 0; } }
    @keyframes cn-cd { 0%, 54% { stroke-dashoffset: 101; } 64%, 100% { stroke-dashoffset: 0; } }
    @keyframes cn-de { 0%, 64% { stroke-dashoffset: 101; } 74%, 100% { stroke-dashoffset: 0; } }
    .cn-star { transform-box: fill-box; transform-origin: 50% 50%; }
    .cn-s1 { animation: cn-s1 4.4s cubic-bezier(.4,.05,.35,1.2) infinite; }
    .cn-s2 { animation: cn-s2 4.4s cubic-bezier(.4,.05,.35,1.2) infinite; }
    .cn-s3 { animation: cn-s3 4.4s cubic-bezier(.4,.05,.35,1.2) infinite; }
    .cn-s4 { animation: cn-s4 4.4s cubic-bezier(.4,.05,.35,1.2) infinite; }
    .cn-s5 { animation: cn-s5 4.4s cubic-bezier(.4,.05,.35,1.2) infinite; }
    @keyframes cn-s1 { 0%, 2%  { transform: scale(0); } 8%  { transform: scale(1.3); } 12%, 100% { transform: scale(1); } }
    @keyframes cn-s2 { 0%, 8%  { transform: scale(0); } 14% { transform: scale(1.3); } 18%, 74% { transform: scale(1); }
                       78% { transform: scale(1.28); } 82%, 100% { transform: scale(1); } }
    @keyframes cn-s3 { 0%, 14% { transform: scale(0); } 20% { transform: scale(1.3); } 24%, 100% { transform: scale(1); } }
    @keyframes cn-s4 { 0%, 20% { transform: scale(0); } 26% { transform: scale(1.3); } 30%, 100% { transform: scale(1); } }
    @keyframes cn-s5 { 0%, 26% { transform: scale(0); } 32% { transform: scale(1.3); } 36%, 100% { transform: scale(1); } }
    .cn-fade { animation: cn-fade 4.4s linear infinite; }
    @keyframes cn-fade { 0%, 86% { opacity: 1; } 96%, 99.9% { opacity: 0; } 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .cn-ab, .cn-bc, .cn-cd, .cn-de, .cn-s1, .cn-s2, .cn-s3, .cn-s4, .cn-s5, .cn-fade { animation: none; }
      .cn-line { stroke-dasharray: none; stroke-dashoffset: 0; }
      .cn-star { transform: scale(1); }
    }
  </style>
  <g class="cn-fade">
    <path class="cn-line cn-ab" pathLength="100" d="M38 46 C44 41 50 36 57 31"/>
    <path class="cn-line cn-bc" pathLength="100" d="M57 31 C64 33.5 71.5 37 79 40"/>
    <path class="cn-line cn-cd" pathLength="100" d="M79 40 C76.5 48.5 73.5 56.5 71 65"/>
    <path class="cn-line cn-de" pathLength="100" d="M71 65 C62.5 66.5 54 68.5 46 70"/>
    <circle class="cn-star cn-s1" fill="var(--bello-ink, #1E2A21)" cx="38" cy="46" r="2.2"/>
    <circle class="cn-star cn-s2" fill="var(--bello-accent, #3E7B4F)" cx="57" cy="31" r="2.9"/>
    <circle class="cn-star cn-s3" fill="var(--bello-ink, #1E2A21)" cx="79" cy="40" r="2"/>
    <circle class="cn-star cn-s4" fill="var(--bello-ink, #1E2A21)" cx="71" cy="65" r="2.4"/>
    <circle class="cn-star cn-s5" fill="var(--bello-ink, #1E2A21)" cx="46" cy="70" r="2"/>
  </g>
</svg>
