<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Gathering sources">
  <style>
    .st-card { fill: var(--bello-paper, #FCFEFA); stroke: var(--bello-ink, #1E2A21); stroke-width: 2.4; stroke-linejoin: round; }
    .st-ink { stroke: var(--bello-ink, #1E2A21); fill: none; stroke-linecap: round; }
    .st-acc { stroke: var(--bello-accent, #3E7B4F); fill: none; stroke-linecap: round; }
    .st-1, .st-2, .st-3 { transform-box: fill-box; transform-origin: 50% 50%; }
    .st-1 { animation: st-d1 3.6s cubic-bezier(.4,.05,.35,1) infinite; }
    .st-2 { animation: st-d2 3.6s cubic-bezier(.4,.05,.35,1) infinite; }
    .st-3 { animation: st-d3 3.6s cubic-bezier(.4,.05,.35,1) infinite; }
    @keyframes st-d1 {
      0%, 2%    { transform: translateY(-26px) rotate(-5deg); opacity: 0; }
      10%       { transform: translateY(1.5px) rotate(.5deg); opacity: 1; }
      14%, 100% { transform: translateY(0) rotate(0deg); opacity: 1; }
    }
    @keyframes st-d2 {
      0%, 16%   { transform: translateY(-26px) rotate(5deg); opacity: 0; }
      24%       { transform: translateY(1.5px) rotate(-.5deg); opacity: 1; }
      28%, 100% { transform: translateY(0) rotate(0deg); opacity: 1; }
    }
    @keyframes st-d3 {
      0%, 30%   { transform: translateY(-26px) rotate(-4deg); opacity: 0; }
      38%       { transform: translateY(1.5px) rotate(.5deg); opacity: 1; }
      42%, 100% { transform: translateY(0) rotate(0deg); opacity: 1; }
    }
    .st-fade { animation: st-fade 3.6s linear infinite; }
    @keyframes st-fade { 0%, 82% { opacity: 1; } 91%, 99.9% { opacity: 0; } 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .st-1, .st-2, .st-3, .st-fade { animation: none; }
      .st-1, .st-2, .st-3 { transform: none; opacity: 1; }
    }
  </style>
  <g class="st-fade">
    <g class="st-1">
      <path class="st-card" transform="rotate(-3 60 71)" d="M40 64 C53 62.8 68 63.2 80 64 C81.2 68.5 81.3 73.5 80.2 78 C67 79.2 52 78.8 39.8 78 C38.6 73.5 38.8 68.3 40 64 Z"/>
    </g>
    <g class="st-2">
      <path class="st-card" transform="rotate(2.5 59 57)" d="M38 50 C51 48.8 66 49.2 78 50 C79.2 54.5 79.3 59.5 78.2 64 C65 65.2 50 64.8 37.8 64 C36.6 59.5 36.8 54.3 38 50 Z"/>
    </g>
    <g class="st-3">
      <path class="st-card" transform="rotate(-1.5 61 43)" d="M41 36 C54 34.8 69 35.2 81 36 C82.2 40.5 82.3 45.5 81.2 50 C68 51.2 53 50.8 40.8 50 C39.6 45.5 39.8 40.3 41 36 Z"/>
      <path class="st-acc" transform="rotate(-1.5 61 43)" stroke-width="2.6" d="M47 43 C53 42.3 60 42.7 66 42.4"/>
      <path class="st-ink" transform="rotate(-1.5 61 43)" stroke-width="2" opacity=".5" d="M70 42.6 L74.5 42.4"/>
    </g>
  </g>
</svg>
