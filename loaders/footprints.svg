<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Step by step">
  <style>
    .fp-p { fill: var(--bello-ink, #1E2A21); transform-box: fill-box; transform-origin: 50% 50%; }
    .fp-acc { fill: var(--bello-accent, #3E7B4F); }
    .fp-1 { animation: fp-1 4s cubic-bezier(.4,.05,.35,1.2) infinite; }
    .fp-2 { animation: fp-2 4s cubic-bezier(.4,.05,.35,1.2) infinite; }
    .fp-3 { animation: fp-3 4s cubic-bezier(.4,.05,.35,1.2) infinite; }
    .fp-4 { animation: fp-4 4s cubic-bezier(.4,.05,.35,1.2) infinite; }
    .fp-5 { animation: fp-5 4s cubic-bezier(.4,.05,.35,1.2) infinite; }
    .fp-6 { animation: fp-6 4s cubic-bezier(.4,.05,.35,1.2) infinite; }
    @keyframes fp-1 { 0%, 4%  { transform: scale(0); } 9%  { transform: scale(1.25); } 12%, 100% { transform: scale(1); } }
    @keyframes fp-2 { 0%, 13% { transform: scale(0); } 18% { transform: scale(1.25); } 21%, 100% { transform: scale(1); } }
    @keyframes fp-3 { 0%, 22% { transform: scale(0); } 27% { transform: scale(1.25); } 30%, 100% { transform: scale(1); } }
    @keyframes fp-4 { 0%, 31% { transform: scale(0); } 36% { transform: scale(1.25); } 39%, 100% { transform: scale(1); } }
    @keyframes fp-5 { 0%, 40% { transform: scale(0); } 45% { transform: scale(1.25); } 48%, 100% { transform: scale(1); } }
    @keyframes fp-6 { 0%, 49% { transform: scale(0); } 55% { transform: scale(1.45); } 58%, 100% { transform: scale(1); } }
    .fp-fade { animation: fp-fade 4s linear infinite; }
    @keyframes fp-fade { 0%, 84% { opacity: 1; } 94%, 99.9% { opacity: 0; } 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .fp-1, .fp-2, .fp-3, .fp-4, .fp-5, .fp-6, .fp-fade { animation: none; }
      .fp-p { transform: scale(1); }
    }
  </style>
  <defs>
    <path id="fp-bean" d="M0 -3 C2 -2.8 3 -1 2.6 1 C2.2 2.9 .6 3.9 -1.1 3.4 C-2.9 2.9 -3.6 1 -3 -.9 C-2.6 -2.2 -1.4 -3.1 0 -3 Z"/>
  </defs>
  <g class="fp-fade">
    <g transform="translate(34 83) rotate(-36)"><use class="fp-p fp-1" href="#fp-bean"/></g>
    <g transform="translate(47 74) rotate(-44)"><use class="fp-p fp-2" href="#fp-bean"/></g>
    <g transform="translate(51 62) rotate(-50)"><use class="fp-p fp-3" href="#fp-bean"/></g>
    <g transform="translate(63 54) rotate(-44)"><use class="fp-p fp-4" href="#fp-bean"/></g>
    <g transform="translate(67.5 42) rotate(-52)"><use class="fp-p fp-5" href="#fp-bean"/></g>
    <g transform="translate(80 36) rotate(-40)"><use class="fp-p fp-acc fp-6" href="#fp-bean"/></g>
  </g>
</svg>
