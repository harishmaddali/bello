<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Having an idea">
  <style>
    .bu-ink { stroke: var(--bello-ink, #211E1B); fill: none; stroke-linecap: round; }
    .bu-ray { stroke: var(--bello-accent, #C4502C); fill: none; stroke-linecap: round; stroke-width: 2.8;
              transform-box: fill-box; transform-origin: 50% 50%; animation: bu-ray 2.8s cubic-bezier(.4,.05,.35,1) infinite; }
    .bu-r2 { animation-delay: .12s; } .bu-r3 { animation-delay: .22s; }
    .bu-r4 { animation-delay: .07s; } .bu-r5 { animation-delay: .17s; }
    @keyframes bu-ray {
      0%        { transform: scale(.2); opacity: 0; }
      14%       { transform: scale(1.15); opacity: 1; }
      22%       { transform: scale(1); opacity: 1; }
      58%       { transform: scale(1); opacity: 1; }
      74%, 100% { transform: scale(.2); opacity: 0; }
    }
    .bu-bulb { transform-origin: 60px 52px; animation: bu-pulse 2.8s ease-in-out infinite; }
    @keyframes bu-pulse { 0%, 74%, 100% { transform: scale(1); } 18% { transform: scale(1.04); } }
    .bu-fil { animation: bu-fil 2.8s ease-in-out infinite; }
    @keyframes bu-fil { 0%, 100% { opacity: .45; } 18%, 55% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .bu-ray, .bu-bulb, .bu-fil { animation: none; }
      .bu-ray { transform: none; opacity: 1; }
    }
  </style>
  <g class="bu-bulb">
    <path class="bu-ink" stroke-width="2.8"
          d="M60 35 C70 35.2 77.3 43 76.8 52.6 C76.4 59.4 72 64.3 67.5 67.6 L52.8 67.4 C48.2 64 43.8 59.2 43.5 52.4 C43.1 43.2 50.2 34.8 60 35"/>
    <path class="bu-ink bu-fil" stroke-width="2.2" d="M54 60.5 Q57 54.5 60 60 Q63 65.5 66 59.5"/>
    <path class="bu-ink" stroke-width="2.4" d="M53.5 72.5 C58 72.9 63 72.7 67 72.2"/>
    <path class="bu-ink" stroke-width="2.2" d="M55.5 77.5 C58.5 77.9 62 77.8 65 77.4"/>
  </g>
  <path class="bu-ray bu-r1" d="M60 26.5 C60.1 24 60 21.5 59.8 19"/>
  <path class="bu-ray bu-r2" d="M76.5 33.5 C78.2 31.7 79.9 29.8 81.5 27.8"/>
  <path class="bu-ray bu-r3" d="M84.5 49.5 C87 49.3 89.7 49 92.3 48.6"/>
  <path class="bu-ray bu-r4" d="M43.5 33.5 C41.8 31.7 40.1 29.8 38.6 27.8"/>
  <path class="bu-ray bu-r5" d="M35.5 49.5 C33 49.4 30.3 49.2 27.7 48.9"/>
</svg>
