<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Taking its time">
  <style>
    .sn-ink { stroke: var(--bello-ink, #1E2A21); fill: none; stroke-linecap: round; }
    .sn-trail { stroke-dasharray: 2 6; animation: sn-trail 1.2s linear infinite; }
    @keyframes sn-trail { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -16; } }
    .sn-inch { transform-origin: 44px 77px; animation: sn-inch 1.4s ease-in-out infinite alternate; }
    @keyframes sn-inch { from { transform: scaleX(1); } to { transform: scaleX(1.06); } }
    @media (prefers-reduced-motion: reduce) {
      .sn-trail, .sn-inch { animation: none; }
    }
  </style>
  <!-- slime trail -->
  <path class="sn-ink sn-trail" stroke-width="2" opacity=".45" d="M26 78 C38 79 56 79 74 78.5"/>
  <g class="sn-inch">
    <!-- body -->
    <path fill="var(--bello-paper, #FCFEFA)" stroke="var(--bello-ink, #1E2A21)" stroke-width="2.2" stroke-linejoin="round"
          d="M46 77 C48 73.5 53 71 58 71.5 C65 72.2 72.5 71.5 76.5 72.8 C79.5 73.8 81.3 75.3 81.5 77.2 C70 78.6 56 78.4 46 77 Z"/>
    <!-- eye stalks -->
    <path class="sn-ink" stroke-width="1.9" d="M78.5 72.5 C79.4 69.7 79.9 67.6 79.8 65.4"/>
    <circle fill="var(--bello-ink, #1E2A21)" cx="79.9" cy="64.4" r="1.3"/>
    <path class="sn-ink" stroke-width="1.9" d="M74.5 71.8 C75 69.5 75.6 67.7 76.6 65.9"/>
    <circle fill="var(--bello-ink, #1E2A21)" cx="76.9" cy="65" r="1.2"/>
    <!-- shell spiral -->
    <path class="sn-ink" stroke-width="2.4"
          d="M57 76.5 C49.5 76.5 44.5 71.5 45 65.5 C45.4 60 50.5 56 56.5 56.5 C62 57 66 61.5 65.5 66.5 C65 71 61 74 56.5 73.5 C53 73.1 50.8 70.3 51.2 67 C51.6 64.3 54 62.5 56.7 62.9 C58.9 63.3 60.2 65.1 59.8 67.2"/>
    <circle fill="var(--bello-accent, #3E7B4F)" cx="57.8" cy="66.2" r="1.5"/>
  </g>
</svg>
