<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Reaching the model">
  <style>
    .si-arc { stroke: var(--bello-ink, #1E2A21); fill: none; stroke-linecap: round;
              transform-origin: 42px 76px; animation: si-ping 2.6s cubic-bezier(.4,.05,.35,1) infinite; }
    .si-a2 { animation-delay: .22s; }
    .si-a3 { animation-delay: .44s; }
    @keyframes si-ping {
      0%        { transform: scale(.7); opacity: 0; }
      16%       { transform: scale(1); opacity: 1; }
      58%       { transform: scale(1); opacity: 1; }
      76%, 100% { transform: scale(1.06); opacity: 0; }
    }
    .si-dot { fill: var(--bello-accent, #3E7B4F); transform-origin: 42px 76px; animation: si-dot 2.6s ease-out infinite; }
    @keyframes si-dot {
      0%       { transform: scale(.8); }
      12%      { transform: scale(1.25); }
      24%, 100%{ transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .si-arc, .si-dot { animation: none; }
      .si-arc { transform: none; opacity: 1; }
    }
  </style>
  <path class="si-dot" d="M42 71.8 C44.6 71.6 46.4 73.4 46.3 75.9 C46.2 78.4 44 80.1 41.6 79.5 C39.4 78.9 38.2 76.7 39 74.6 C39.6 73 40.6 72 42 71.8 Z"/>
  <path class="si-arc si-a1" stroke-width="2.8" pathLength="100" d="M45.2 63.6 C49.6 64.8 53 68.4 54.1 73.6"/>
  <path class="si-arc si-a2" stroke-width="2.8" pathLength="100" d="M47.5 54.7 C54.7 55.7 61.9 64 63 73.3"/>
  <path class="si-arc si-a3" stroke-width="2.8" pathLength="100" d="M50 46 C59.6 47.6 70.6 59.6 71.9 72.5"/>
</svg>
