<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Polishing your words">
  <style>
    .h-ink { stroke: var(--bello-ink, #211E1B); fill: none; stroke-linecap: round; }
    .h-marker { stroke: var(--bello-highlight, #F3BFA9); fill: none; stroke-linecap: round; opacity: .62; }
    .h-swipe { stroke-dasharray: 100 150; stroke-dashoffset: 101; }
    .h-s1 { animation: h-s1 3.4s linear infinite; }
    .h-s2 { animation: h-s2 3.4s linear infinite; }
    @keyframes h-s1 { 0%, 3%  { stroke-dashoffset: 101; } 25%, 100% { stroke-dashoffset: 0; } }
    @keyframes h-s2 { 0%, 38% { stroke-dashoffset: 101; } 60%, 100% { stroke-dashoffset: 0; } }
    .h-fade { animation: h-fade 3.4s linear infinite; }
    @keyframes h-fade { 0%, 78% { opacity: 1; } 88%, 99.9% { opacity: 0; } 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .h-s1, .h-s2, .h-fade { animation: none; }
      .h-swipe { stroke-dasharray: none; stroke-dashoffset: 0; }
    }
  </style>
  <g class="h-fade">
    <path class="h-marker h-swipe h-s1" stroke-width="11" pathLength="100" d="M15 50.8 C40 49.2 75 50.8 104 49.4"/>
    <path class="h-marker h-swipe h-s2" stroke-width="11" pathLength="100" d="M19 70.6 C42 69.2 70 70.9 97 69.5"/>
  </g>
  <path class="h-ink" stroke-width="3.2" d="M18 50 C34 48.5 52 50.5 70 49.5 C84 49 96 50 102 49.6"/>
  <path class="h-ink" stroke-width="3.2" d="M22 70 C38 69 56 70.8 74 69.8 C84 69.4 90 70.2 94 69.8"/>
</svg>
