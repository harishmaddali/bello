<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Pulling it together">
  <style>
    .l-arc {
      stroke: var(--bello-ink, #1E2A21);
      fill: none; stroke-width: 3.4; stroke-linecap: round;
      animation: l-spin 1.55s linear infinite;
    }
    @keyframes l-spin {
      0%   { stroke-dasharray: 6 94;  stroke-dashoffset: 0; }
      47%  { stroke-dasharray: 56 44; stroke-dashoffset: -38; }
      100% { stroke-dasharray: 6 94;  stroke-dashoffset: -100; }
    }
    @media (prefers-reduced-motion: reduce) {
      .l-arc { animation: none; stroke-dasharray: 70 30; }
    }
  </style>
  <path class="l-arc" pathLength="100"
        d="M60 36 C73.5 35.2 84.8 46.5 84.2 60.5 C83.6 74 72.5 84.6 59.2 84 C46 83.4 35.6 72.8 36.2 59.2 C36.8 46.4 47.5 36.7 60 36"/>
</svg>
