<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Checking it's safe">
  <style>
    .sh-line {
      stroke: var(--bello-ink, #1E2A21); fill: none; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 100 150; stroke-dashoffset: 101;
      animation: sh-draw 3.6s linear infinite;
    }
    @keyframes sh-draw { 0%, 2% { stroke-dashoffset: 101; } 30%, 100% { stroke-dashoffset: 0; } }
    .sh-check {
      stroke: var(--bello-accent, #3E7B4F); fill: none; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 100 150; stroke-dashoffset: 101;
      animation: sh-check 3.6s linear infinite;
    }
    @keyframes sh-check { 0%, 36% { stroke-dashoffset: 101; } 50%, 100% { stroke-dashoffset: 0; } }
    .sh-pop { transform-box: fill-box; transform-origin: 50% 50%; animation: sh-pop 3.6s cubic-bezier(.4,.05,.35,1) infinite; }
    @keyframes sh-pop {
      0%, 50%   { transform: scale(1); }
      57%       { transform: scale(1.08); }
      64%, 100% { transform: scale(1); }
    }
    .sh-fade { animation: sh-fade 3.6s linear infinite; }
    @keyframes sh-fade { 0%, 84% { opacity: 1; } 94%, 99.9% { opacity: 0; } 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .sh-line, .sh-check, .sh-pop, .sh-fade { animation: none; }
      .sh-line, .sh-check { stroke-dasharray: none; stroke-dashoffset: 0; }
    }
  </style>
  <g class="sh-fade">
    <g class="sh-pop">
      <path class="sh-line" pathLength="100"
            d="M60 32 C67 35.5 74.5 37.5 81 38 C81.5 50 79.5 62 73.5 70.5 C69.5 76 64.5 80 60 82.5 C55.5 80 50.5 76 46.5 70.5 C40.5 62 38.5 50 39 38 C45.5 37.5 53 35.5 60 32 Z"/>
      <path class="sh-check" pathLength="100" d="M50 58.5 C53 62 55.5 65 57.5 67.8 C61.5 60.5 66.5 53.5 71.5 48.5"/>
    </g>
  </g>
</svg>
