<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Fitting the pieces">
  <style>
    .pz-piece { fill: var(--bello-paper, #FCFEFA); stroke: var(--bello-ink, #1E2A21); stroke-width: 2.3; stroke-linejoin: round; }
    .pz-m { animation: pz-m 4s cubic-bezier(.55,.08,.6,1) infinite; }
    @keyframes pz-m {
      0%, 4%    { transform: translateY(-26px); opacity: 0; }
      8%        { opacity: 1; }
      16%       { transform: translateY(1.5px); opacity: 1; }
      21%, 100% { transform: translateY(0); opacity: 1; }
    }
    .pz-l { animation: pz-l 4s cubic-bezier(.5,.05,.45,1) infinite; }
    @keyframes pz-l {
      0%, 22%   { transform: translateX(-14px); }
      36%       { transform: translateX(1.2px); }
      41%, 100% { transform: translateX(0); }
    }
    .pz-r { animation: pz-r 4s cubic-bezier(.5,.05,.45,1) infinite; }
    @keyframes pz-r {
      0%, 40%   { transform: translateX(14px); }
      54%       { transform: translateX(-1.2px); }
      59%, 100% { transform: translateX(0); }
    }
    .pz-click { transform-origin: 60px 60px; animation: pz-click 4s ease-out infinite; }
    @keyframes pz-click {
      0%, 58%   { transform: scale(1); }
      62%       { transform: scale(1.04, .95); }
      67%, 100% { transform: scale(1); }
    }
    .pz-star { stroke: var(--bello-accent, #3E7B4F); fill: none; stroke-width: 2.6; stroke-linecap: round;
               transform-box: fill-box; transform-origin: 50% 50%; animation: pz-star 4s cubic-bezier(.4,.05,.35,1.2) infinite; }
    @keyframes pz-star {
      0%, 62%   { transform: scale(0) rotate(-20deg); opacity: 0; }
      68%       { transform: scale(1.2) rotate(0deg); opacity: 1; }
      73%, 80%  { transform: scale(1); opacity: 1; }
      88%, 100% { transform: scale(.4); opacity: 0; }
    }
    .pz-fade { animation: pz-fade 4s linear infinite; }
    @keyframes pz-fade { 0%, 86% { opacity: 1; } 94%, 99.9% { opacity: 0; } 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .pz-m, .pz-l, .pz-r, .pz-click, .pz-star, .pz-fade { animation: none; }
      .pz-m { transform: none; opacity: 1; }
      .pz-l, .pz-r { transform: none; }
      .pz-star { opacity: 0; }
    }
  </style>
  <g class="pz-fade">
    <g class="pz-click">
      <g class="pz-l">
        <path class="pz-piece" d="M29 49 C35 48.2 42 48.2 47.5 48.6 C47.7 51.2 47.8 54 47.9 56.8 C50.9 55.9 53.3 57.6 53.2 60.1 C53.1 62.5 50.7 64 47.95 63.2 C47.95 65.9 47.85 68.7 47.7 71.2 C41.5 71.9 35 71.8 29.5 71.2 C28.8 64.2 28.8 56.2 29 49 Z"/>
      </g>
      <g class="pz-m">
        <path class="pz-piece" d="M49.8 48.8 C55.5 48.3 62 48.4 69.3 48.8 C69.45 51.3 69.5 54 69.6 56.9 C72.6 56 75 57.7 74.9 60.2 C74.8 62.6 72.4 64.1 69.65 63.3 C69.6 66 69.5 68.7 69.3 71.3 C62 71.8 55.5 71.8 50 71.3 C49.95 68.6 49.9 66 49.9 63.4 C52.9 64.2 55.2 62.6 55.1 60.2 C55 57.8 52.7 56.2 49.9 57 C49.9 54.2 49.85 51.5 49.8 48.8 Z"/>
      </g>
      <g class="pz-r">
        <path class="pz-piece" d="M71.3 49 C77.5 48.4 84 48.6 90.5 49.2 C91.3 56.4 91.2 64 90.7 71 C84 71.8 77.5 71.6 71.5 71.1 C71.45 68.5 71.4 65.9 71.4 63.5 C74.4 64.3 76.8 62.7 76.7 60.3 C76.6 57.9 74.2 56.3 71.4 57.1 C71.37 54.4 71.33 51.7 71.3 49 Z"/>
      </g>
    </g>
    <g class="pz-star">
      <path d="M60 31 Q59.7 35.5 60 40"/>
      <path d="M55.5 35.5 Q60 35.2 64.5 35.5"/>
    </g>
  </g>
</svg>
