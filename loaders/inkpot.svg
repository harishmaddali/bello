<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Dipping the pen">
  <style>
    .ik-ink { stroke: var(--bello-ink, #1E2A21); fill: none; stroke-linecap: round; }
    .ik-pen { animation: ik-pen 3.4s cubic-bezier(.5,.05,.5,1) infinite; }
    @keyframes ik-pen {
      0%, 8%    { transform: translate(13px, -20px) rotate(8deg); }
      26%       { transform: translate(0, 0) rotate(0deg); }
      32%       { transform: translate(0, 2.5px) rotate(0deg); }
      48%       { transform: translate(0, 2.5px) rotate(0deg); }
      64%, 100% { transform: translate(13px, -20px) rotate(8deg); }
    }
    .ik-drip { fill: var(--bello-accent, #3E7B4F); animation: ik-drip 3.4s ease-in infinite; }
    @keyframes ik-drip {
      0%, 68%   { transform: translateY(0) scale(.5); opacity: 0; }
      74%       { transform: translateY(1px) scale(1); opacity: 1; }
      84%       { transform: translateY(8px); opacity: 1; }
      88%, 100% { transform: translateY(10px) scale(.8); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ik-pen, .ik-drip { animation: none; }
      .ik-pen { transform: translate(13px, -20px) rotate(8deg); }
      .ik-drip { opacity: 0; }
    }
  </style>
  <!-- pen -->
  <g class="ik-pen">
    <path class="ik-ink" stroke-width="2.8" d="M60 58 C63 51 66.5 45 70.5 39.5"/>
    <path class="ik-ink" stroke-width="1.8" d="M60 58 C61 56.4 61.9 54.9 62.8 53.4"/>
    <circle fill="var(--bello-ink, #1E2A21)" cx="70.8" cy="39" r="1.9"/>
  </g>
  <!-- drip -->
  <circle class="ik-drip" cx="60" cy="57" r="2.2"/>
  <!-- ink pot -->
  <path class="ik-ink" stroke-width="2.4" d="M50 56.5 C50 58.8 50 61.2 50 63.5"/>
  <path class="ik-ink" stroke-width="2.4" d="M70 56.5 C70 58.8 70 61.2 70 63.5"/>
  <path class="ik-ink" stroke-width="2.2" d="M48.5 56 C54.5 55 65.5 55 71.5 56"/>
  <path fill="var(--bello-paper, #FCFEFA)" stroke="var(--bello-ink, #1E2A21)" stroke-width="2.4" stroke-linejoin="round"
        d="M48.5 63.5 C47.2 63.5 46.5 64.4 46.7 65.6 C47.2 70.5 47.9 75.5 49 80 C56.4 81.2 64 81.2 71.2 80 C72.3 75.5 73 70.5 73.5 65.6 C73.7 64.4 73 63.5 71.7 63.5 Z"/>
  <path class="ik-ink" stroke-width="2.2" opacity=".55" d="M52 70 C57.5 70.8 63 70.8 68.5 70"/>
</svg>
