<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Writing your draft">
  <style>
    .q-ink { stroke: var(--bello-ink, #1E2A21); }
    .q-feather { fill: var(--bello-accent, #3E7B4F); }
  </style>
  <!-- ink squiggle -->
  <g>
    <animate attributeName="opacity" values="1;1;1;0;0" keyTimes="0;0.7;0.86;0.96;1" dur="3.4s" repeatCount="indefinite"/>
    <path id="q-path" class="q-ink" fill="none" stroke-width="3" stroke-linecap="round"
          d="M20 73 Q26 57 32 72 Q38 86 44 71 Q50 57 56 72 Q62 88 68 72 Q74 58 80 73 Q86 87 92 72.5"
          pathLength="100" stroke-dasharray="100 150" stroke-dashoffset="100.5">
      <animate attributeName="stroke-dashoffset" values="100.5;0;0" keyTimes="0;0.7;1" dur="3.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- quill, nib riding the tip of the line -->
  <g>
    <animate attributeName="opacity" values="1;1;1;0;0" keyTimes="0;0.7;0.86;0.96;1" dur="3.4s" repeatCount="indefinite"/>
    <g>
      <animateMotion dur="3.4s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.7;1">
        <mpath xlink:href="#q-path" href="#q-path"/>
      </animateMotion>
      <g>
        <animateTransform attributeName="transform" type="rotate" additive="sum" values="-3 0 0;3 0 0;-3 0 0" dur="0.55s" repeatCount="indefinite"/>
        <path class="q-feather" d="M5 -7 C2 -17 8 -28 18 -27.5 C23 -17 18 -8 7 -4.5 Z"/>
        <path class="q-ink" fill="none" stroke-width="2" stroke-linecap="round" d="M0 0 C4 -7 9 -15 18 -24"/>
        <path class="q-ink" fill="none" stroke-width="1.4" stroke-linecap="round" opacity="0.45" d="M8 -11 L12 -14 M11 -17 L15 -19"/>
      </g>
    </g>
  </g>
</svg>
