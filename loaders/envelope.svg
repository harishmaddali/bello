<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Sealing it up">
  <style>
    .en-ink { stroke: var(--bello-ink, #1E2A21); fill: none; stroke-linecap: round; }
    .en-paper { fill: var(--bello-paper, #FCFEFA); stroke: var(--bello-ink, #1E2A21); stroke-linejoin: round; }
    .en-letter { animation: en-slide 4.2s cubic-bezier(.55,.08,.55,1) infinite; }
    @keyframes en-slide {
      0%, 8%    { transform: translateY(0); }
      30%, 100% { transform: translateY(27px); }
    }
    .en-seal { fill: var(--bello-accent, #3E7B4F); transform-origin: 60px 66.5px; animation: en-seal 4.2s cubic-bezier(.4,.05,.35,1.2) infinite; }
    @keyframes en-seal {
      0%, 36%   { transform: scale(0); }
      42%       { transform: scale(1.3); }
      46%, 100% { transform: scale(1); }
    }
    .en-wiggle { transform-origin: 60px 67px; animation: en-wiggle 4.2s ease-in-out infinite; }
    @keyframes en-wiggle {
      0%, 52% { transform: rotate(0deg); }
      55%     { transform: rotate(-2.2deg); }
      58%     { transform: rotate(2deg); }
      61%     { transform: rotate(-1.2deg); }
      64%, 100% { transform: rotate(0deg); }
    }
    .en-fade { animation: en-fade 4.2s linear infinite; }
    @keyframes en-fade { 0%, 84% { opacity: 1; } 93%, 99.9% { opacity: 0; } 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .en-letter, .en-seal, .en-wiggle, .en-fade { animation: none; }
      .en-letter { transform: translateY(27px); }
      .en-seal { transform: scale(1); }
    }
  </style>
  <g class="en-fade">
    <g class="en-wiggle">
      <g class="en-letter">
        <path class="en-paper" stroke-width="2.2" d="M44 28 C54 27 66 27.4 76 28.2 C77 36 76.8 44 76.2 52.5 C66 53.4 54 53.2 44.5 52.6 C43.6 44 43.6 36 44 28 Z"/>
        <path class="en-ink" stroke-width="2" opacity=".6" d="M50 36 C56 35.4 64 35.8 70 35.5"/>
        <path class="en-ink" stroke-width="2" opacity=".6" d="M50 43 C56 42.5 62 42.8 67 42.6"/>
      </g>
      <path class="en-paper" stroke-width="2.6" d="M36 54 C52 52.8 70 53.2 84 54 C85.4 63 85.2 72 84.4 80.5 C68 81.8 50 81.5 35.8 80.6 C34.8 71.5 35 62.5 36 54 Z"/>
      <path class="en-ink" stroke-width="2.4" d="M37 55 C44.5 60.5 52 65.5 60 70 C68 65.5 75.5 60.5 83 55"/>
      <path class="en-seal" d="M60 63.5 C58.3 60.8 54.8 61.4 54.8 64 C54.8 66.2 57.4 67.6 60 70 C62.6 67.6 65.2 66.2 65.2 64 C65.2 61.4 61.7 60.8 60 63.5 Z"/>
    </g>
  </g>
</svg>
