<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Keeping the beat">
  <style>
    .me-ink { stroke: var(--bello-ink, #1E2A21); fill: none; stroke-linecap: round; }
    .me-body { fill: var(--bello-paper, #FCFEFA); stroke: var(--bello-ink, #1E2A21); stroke-width: 2.4; stroke-linejoin: round; }
    .me-arm { transform-origin: 60px 72px; animation: me-tick .8s cubic-bezier(.45,.05,.55,1) infinite alternate; }
    @keyframes me-tick { from { transform: rotate(-20deg); } to { transform: rotate(20deg); } }
    @media (prefers-reduced-motion: reduce) {
      .me-arm { animation: none; transform: rotate(-20deg); }
    }
  </style>
  <path class="me-body" d="M48 78 C52 64 55 50 57.5 38 C59.2 37.6 60.8 37.6 62.5 38 C65 50 68 64 72 78 C64 79.2 56 79.2 48 78 Z"/>
  <path class="me-ink" stroke-width="2.8" d="M45.5 78.5 C55 80 65 80 74.5 78.5"/>
  <g class="me-arm">
    <path class="me-ink" stroke-width="2.2" d="M60 72 C60 62 60 52 60 43"/>
    <path fill="var(--bello-accent, #3E7B4F)" d="M57.5 49.5 C59 49.2 61 49.2 62.5 49.5 C62.8 51.5 62.8 53.7 62.5 55.5 C61 55.8 59 55.8 57.5 55.5 C57.2 53.7 57.2 51.5 57.5 49.5 Z"/>
  </g>
  <circle fill="var(--bello-ink, #1E2A21)" cx="60" cy="72" r="2.2"/>
</svg>
