<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Pulling things in">
  <style>
    .mg-ink { stroke: var(--bello-ink, #1E2A21); fill: none; stroke-linecap: round; }
    .mg-field { stroke: var(--bello-ink, #1E2A21); fill: none; stroke-width: 1.8; stroke-dasharray: 3 4;
                animation: mg-field 1.1s ease-in-out infinite alternate; }
    .mg-f2 { animation-delay: -.55s; }
    @keyframes mg-field { from { opacity: .25; } to { opacity: .65; } }
    .mg-dot { transform-box: fill-box; transform-origin: 50% 50%; }
    .mg-d1 { animation: mg-d1 3.4s cubic-bezier(.45,.05,.4,1) infinite; }
    .mg-d2 { animation: mg-d2 3.4s cubic-bezier(.45,.05,.4,1) infinite; }
    .mg-d3 { animation: mg-d3 3.4s cubic-bezier(.45,.05,.4,1) infinite; }
    @keyframes mg-d1 { 0%, 10% { transform: translate(14px, -6px); opacity: 0; } 14% { opacity: 1; } 22%, 100% { transform: translate(0, 0); opacity: 1; } }
    @keyframes mg-d2 { 0%, 24% { transform: translate(16px, 0); opacity: 0; }  28% { opacity: 1; } 36%, 100% { transform: translate(0, 0); opacity: 1; } }
    @keyframes mg-d3 { 0%, 38% { transform: translate(14px, 7px); opacity: 0; } 42% { opacity: 1; } 50%, 100% { transform: translate(0, 0); opacity: 1; } }
    .mg-fade { animation: mg-fade 3.4s linear infinite; }
    @keyframes mg-fade { 0%, 84% { opacity: 1; } 93%, 99.9% { opacity: 0; } 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .mg-field, .mg-d1, .mg-d2, .mg-d3, .mg-fade { animation: none; }
      .mg-dot { transform: none; opacity: 1; }
      .mg-field { opacity: .4; }
    }
  </style>
  <!-- horseshoe magnet -->
  <path class="mg-ink" stroke-width="6.5" d="M72 45 L53 45 C41.5 45 34.5 50.5 34.5 58 C34.5 65.5 41.5 71 53 71 L72 71"/>
  <path stroke="var(--bello-accent, #3E7B4F)" stroke-width="6.5" stroke-linecap="round" fill="none" d="M73.5 45 L77.5 45"/>
  <path stroke="var(--bello-accent, #3E7B4F)" stroke-width="6.5" stroke-linecap="round" fill="none" d="M73.5 71 L77.5 71"/>
  <g class="mg-fade">
    <path class="mg-field mg-f1" d="M82.5 46 C87 49.5 87 54.5 83.5 58"/>
    <path class="mg-field mg-f2" d="M85.5 41.5 C92 47.5 92 62 86 68.5"/>
    <circle class="mg-dot mg-d1" fill="var(--bello-ink, #1E2A21)" cx="83" cy="45.3" r="2.1"/>
    <circle class="mg-dot mg-d2" fill="var(--bello-accent, #3E7B4F)" cx="85" cy="58" r="2.4"/>
    <circle class="mg-dot mg-d3" fill="var(--bello-ink, #1E2A21)" cx="83.5" cy="70.8" r="2"/>
  </g>
</svg>
