<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Typing it up">
  <style>
    .ty-ink { stroke: var(--bello-ink, #1E2A21); fill: none; stroke-linecap: round; }
    .ty-paper { fill: var(--bello-paper, #FCFEFA); stroke: var(--bello-ink, #1E2A21); stroke-linejoin: round; }
    .ty-line { stroke-dasharray: 100 150; stroke-dashoffset: 101; }
    .ty-l1 { animation: ty-l1 3.4s linear infinite; }
    .ty-l2 { animation: ty-l2 3.4s linear infinite; }
    @keyframes ty-l1 { 0%, 6%  { stroke-dashoffset: 101; } 30%, 100% { stroke-dashoffset: 0; } }
    @keyframes ty-l2 { 0%, 38% { stroke-dashoffset: 101; } 62%, 100% { stroke-dashoffset: 0; } }
    .ty-fade { animation: ty-fade 3.4s linear infinite; }
    @keyframes ty-fade { 0%, 82% { opacity: 1; } 92%, 99.9% { opacity: 0; } 100% { opacity: 1; } }
    .ty-key { transform-box: fill-box; transform-origin: 50% 50%; animation: ty-key .42s ease-in-out infinite alternate; }
    .ty-k2 { animation-delay: -.14s; }
    .ty-k3 { animation-delay: -.28s; }
    @keyframes ty-key { from { transform: translateY(0); } to { transform: translateY(1.8px); } }
    @media (prefers-reduced-motion: reduce) {
      .ty-l1, .ty-l2, .ty-fade, .ty-key { animation: none; }
      .ty-line { stroke-dasharray: none; stroke-dashoffset: 0; }
    }
  </style>
  <!-- paper -->
  <path class="ty-paper" stroke-width="2.2" d="M46 38 C54 37.2 66 37.4 74 38 C74.6 45 74.4 52 74 59.5 L46.2 59.5 C45.8 52 45.8 45 46 38 Z"/>
  <g class="ty-fade">
    <path class="ty-ink ty-line ty-l1" stroke-width="2.4" pathLength="100" d="M50 45 C56 44.4 64 44.7 70 44.4"/>
    <path class="ty-ink ty-line ty-l2" stroke-width="2.4" pathLength="100" d="M50 51.5 C55 51 61 51.3 66.5 51"/>
  </g>
  <!-- body -->
  <path class="ty-paper" stroke-width="2.4" d="M34 60 C42 58.8 78 58.8 86 60 C87.2 65.5 87 72 86.2 77 C70 78.4 50 78.2 33.8 77 C33 71.5 33.2 65 34 60 Z"/>
  <path class="ty-ink" stroke-width="2" opacity=".6" d="M42 60.2 C54 59.2 66 59.2 78 60.2"/>
  <!-- keys -->
  <circle class="ty-key ty-k1" fill="var(--bello-ink, #1E2A21)" cx="47" cy="68.5" r="2.5"/>
  <circle class="ty-key ty-k2" fill="var(--bello-accent, #3E7B4F)" cx="60" cy="68.8" r="2.5"/>
  <circle class="ty-key ty-k3" fill="var(--bello-ink, #1E2A21)" cx="73" cy="68.4" r="2.5"/>
</svg>
