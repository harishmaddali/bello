<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Keeping it warm">
  <style>
    .cf-ink { stroke: var(--bello-ink, #1E2A21); fill: none; stroke-linecap: round; }
    .cf-flameA { animation: cf-bA .42s steps(1, end) infinite; }
    .cf-flameB { animation: cf-bB .42s steps(1, end) infinite; }
    @keyframes cf-bA { 0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes cf-bB { 0%, 49.9% { opacity: 0; } 50%, 100% { opacity: 1; } }
    .cf-spark { fill: var(--bello-accent, #3E7B4F); animation: cf-spark 1.7s ease-out infinite; }
    .cf-sp2 { animation-delay: -.85s; }
    @keyframes cf-spark {
      0%        { transform: translateY(0); opacity: 0; }
      20%       { opacity: .9; }
      75%       { opacity: .6; }
      100%      { transform: translateY(-17px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cf-flameA, .cf-flameB, .cf-spark { animation: none; }
      .cf-flameB, .cf-spark { opacity: 0; }
    }
  </style>
  <!-- flame: two boil frames -->
  <g class="cf-flameA">
    <path class="cf-ink" stroke-width="2.6" stroke-linejoin="round"
          d="M60 42 C66 48.5 69.5 55 68.5 61.5 C67.6 67.5 64.3 71 60 71.5 C55.7 71 52.4 67.5 51.5 61.5 C50.5 55 54 48.5 60 42 Z"/>
    <path fill="var(--bello-accent, #3E7B4F)" opacity=".8" d="M60 56 C62.8 59.5 63.8 63 62.6 65.8 C61.6 68 58.4 68 57.4 65.8 C56.2 63 57.2 59.5 60 56 Z"/>
  </g>
  <g class="cf-flameB">
    <path class="cf-ink" stroke-width="2.6" stroke-linejoin="round"
          d="M59.5 42.5 C64.5 49.5 68.8 54.5 68 61 C67.2 67.3 64 71.2 59.8 71.5 C55.5 71.2 52.6 67.8 51.9 62 C51.1 55.5 55.5 49 59.5 42.5 Z"/>
    <path fill="var(--bello-accent, #3E7B4F)" opacity=".8" d="M59.7 55.5 C62.2 59.5 63.5 62.8 62.2 65.5 C61.1 67.8 58.3 67.6 57.4 65.4 C56.3 62.6 57.5 59.2 59.7 55.5 Z"/>
  </g>
  <!-- sparks -->
  <circle class="cf-spark cf-sp1" cx="54" cy="44" r="1.7"/>
  <circle class="cf-spark cf-sp2" cx="66.5" cy="46" r="1.5"/>
  <!-- logs -->
  <path class="cf-ink" stroke-width="3.2" d="M45 77 C55 80.5 65 82 75 83.5"/>
  <path class="cf-ink" stroke-width="3.2" d="M45 83.5 C55 82 65 80.5 75 77"/>
</svg>
