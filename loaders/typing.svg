<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Thinking it through">
  <style>
    .t-blob { fill: var(--bello-ink, #1E2A21); }
    .t-tail { stroke: var(--bello-ink, #1E2A21); fill: none; stroke-width: 1.6; stroke-linecap: round; }
    .t-g { transform-box: fill-box; transform-origin: 50% 50%; animation: t-pop 1.3s cubic-bezier(.45,.05,.35,1) infinite; }
    .t-g2 { animation-delay: .17s; }
    .t-g3 { animation-delay: .34s; }
    @keyframes t-pop {
      0%, 100% { transform: translateY(1.5px) scale(.35); opacity: .3; }
      38%      { transform: translateY(-2px) scale(1.1); opacity: 1; }
      52%      { transform: translateY(0) scale(.94); opacity: 1; }
      66%      { transform: scale(1); opacity: .95; }
    }
    @media (prefers-reduced-motion: reduce) {
      .t-g { animation: none; transform: none; opacity: 1; }
    }
  </style>
  <defs>
    <g id="t-dot">
      <path class="t-blob" d="M38 54.8 C41.8 54.6 44 57.4 43.6 60.6 C43.2 63.8 40.2 65.6 37.4 64.9 C34.4 64.1 33.2 61 34.4 58.2 C35.1 56.3 36.4 55 38 54.8 Z"/>
      <path class="t-tail" d="M34 64.6 C32.8 65.7 31.8 66.3 30.6 66.8"/>
    </g>
  </defs>
  <g transform="translate(60 60) scale(1.3) translate(-60 -60)">
    <g class="t-g t-g1"><use href="#t-dot"/></g>
    <g class="t-g t-g2"><use href="#t-dot" transform="translate(22 0) rotate(7 60 60) scale(1)"/></g>
    <g class="t-g t-g3"><use href="#t-dot" transform="translate(44 -0.6) rotate(-5 82 60)"/></g>
  </g>
</svg>
