<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Done">
  <style>
    .c-ring {
      stroke: var(--bello-ink, #1E2A21); fill: none; stroke-width: 3; stroke-linecap: round;
      stroke-dasharray: 100 150; stroke-dashoffset: 101;
      animation: c-ring 3.2s linear infinite;
    }
    @keyframes c-ring { 0%, 2% { stroke-dashoffset: 101; } 32%, 100% { stroke-dashoffset: 0; } }
    .c-mark {
      stroke: var(--bello-accent, #3E7B4F); fill: none; stroke-width: 3.8; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 100 150; stroke-dashoffset: 101;
      animation: c-mark 3.2s linear infinite;
    }
    @keyframes c-mark { 0%, 38% { stroke-dashoffset: 101; } 54%, 100% { stroke-dashoffset: 0; } }
    .c-pop { transform-box: fill-box; transform-origin: 50% 50%; animation: c-pop 3.2s cubic-bezier(.4,.05,.35,1) infinite; }
    @keyframes c-pop {
      0%, 52%  { transform: scale(1); }
      60%      { transform: scale(1.07); }
      68%, 100%{ transform: scale(1); }
    }
    .c-fade { animation: c-fade 3.2s linear infinite; }
    @keyframes c-fade { 0%, 84% { opacity: 1; } 94%, 99.9% { opacity: 0; } 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .c-ring, .c-mark, .c-pop, .c-fade { animation: none; }
      .c-ring, .c-mark { stroke-dasharray: none; stroke-dashoffset: 0; }
    }
  </style>
  <g class="c-fade">
    <g class="c-pop">
      <path class="c-ring" pathLength="100"
            d="M60 32 C74.5 32.5 86 44 85.5 59 C85 73.5 73.5 85 59.5 84.5 C45.5 84 34.5 72.5 35 58.5 C35.5 44.5 46.5 31.5 62 32.4"/>
      <path class="c-mark" pathLength="100" d="M48 59.5 C52 63.5 55 67.5 57.5 70.8 C62 61.8 68 53 75 47"/>
    </g>
  </g>
</svg>
