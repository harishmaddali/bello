<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Reading it through">
  <style>
    .bk-ink { stroke: var(--bello-ink, #1E2A21); fill: none; stroke-linecap: round; }
    .bk-cover { fill: var(--bello-paper, #FCFEFA); stroke: var(--bello-ink, #1E2A21); stroke-width: 2.5; stroke-linejoin: round; }
    .bk-page { stroke: var(--bello-accent, #3E7B4F); fill: none; stroke-width: 2.3; stroke-linecap: round; opacity: 0; }
    /* three hand-drawn frames of a page mid-turn */
    .bk-p1 { animation: bk-p1 1.6s linear infinite; }
    .bk-p2 { animation: bk-p2 1.6s linear infinite; }
    .bk-p3 { animation: bk-p3 1.6s linear infinite; }
    @keyframes bk-p1 { 0%, 15.9% { opacity: 1; } 16%, 100% { opacity: 0; } }
    @keyframes bk-p2 { 0%, 15.9% { opacity: 0; } 16%, 31.9% { opacity: 1; } 32%, 100% { opacity: 0; } }
    @keyframes bk-p3 { 0%, 31.9% { opacity: 0; } 32%, 47.9% { opacity: 1; } 48%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .bk-p1, .bk-p2, .bk-p3 { animation: none; }
      .bk-p2 { opacity: .9; }
    }
  </style>
  <!-- open book: two facing pages, spine dips at center -->
  <path class="bk-cover" d="M60 78 C50 75.5 40 74.5 31 75.5 C30.2 65.5 30.5 56.5 31.5 49 C40 48 50.5 49.5 60 53.5 Z"/>
  <path class="bk-cover" d="M60 78 C70 75.5 80 74.5 89 75.5 C89.8 65.5 89.5 56.5 88.5 49 C80 48 69.5 49.5 60 53.5 Z"/>
  <!-- text hints -->
  <path class="bk-ink" stroke-width="1.8" opacity=".4" d="M38 58 C43.5 57.6 49 58.4 53.5 59.8"/>
  <path class="bk-ink" stroke-width="1.8" opacity=".4" d="M38.5 65 C43.5 64.7 48.5 65.5 53 66.8"/>
  <path class="bk-ink" stroke-width="1.8" opacity=".4" d="M66.5 59.8 C71 58.4 76.5 57.6 82 58"/>
  <path class="bk-ink" stroke-width="1.8" opacity=".4" d="M67 66.8 C71.5 65.5 76.5 64.7 81.5 65"/>
  <!-- turning page frames -->
  <path class="bk-page bk-p1" d="M62.5 53.5 C71.5 47.5 79.5 44.5 86 44.5"/>
  <path class="bk-page bk-p2" d="M60.5 53 C61 44 61 38.5 61.5 33"/>
  <path class="bk-page bk-p3" d="M57.5 53.5 C48.5 47.5 40.5 44.5 34 44.5"/>
</svg>
