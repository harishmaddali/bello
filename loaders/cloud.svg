<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Tucking it away">
  <style>
    .cd-ink { stroke: var(--bello-ink, #1E2A21); fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .cd-cloud { animation: cd-bob 3.2s ease-in-out infinite alternate; }
    @keyframes cd-bob { from { transform: translateY(-1.5px); } to { transform: translateY(1.5px); } }
    .cd-arrow { stroke: var(--bello-accent, #3E7B4F); fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round;
                animation: cd-rise 1.9s cubic-bezier(.45,.05,.5,1) infinite; }
    @keyframes cd-rise {
      0%        { transform: translateY(7px); opacity: 0; }
      22%       { opacity: 1; }
      70%       { opacity: 1; }
      100%      { transform: translateY(-12px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cd-cloud, .cd-arrow { animation: none; }
      .cd-arrow { opacity: 1; }
    }
  </style>
  <g class="cd-cloud">
    <path class="cd-ink" stroke-width="3"
          d="M39 60 C32.5 60 28.5 54.8 30.5 49.2 C32 44.5 37.5 42.2 41.8 44 C42.8 37.8 49.5 33.8 56 35.8 C58.5 30.8 66.5 29.8 71 33.4 C77 30.8 84.5 35 85 41.6 C90.5 42.8 93.3 48.6 90.8 53.8 C88.8 58.2 84 60.4 79.5 59.8 C66 61.3 51.5 61 39 60"/>
  </g>
  <g class="cd-arrow">
    <path d="M60 84 C60.3 79 60.1 74 60 69.5"/>
    <path d="M54 75.5 C56 73.3 58 71.2 60 69.3 C62 71.1 64 73.2 65.8 75.3"/>
  </g>
</svg>
