<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Inking it in">
  <style>
    .p-bar { stroke: var(--bello-ink, #211E1B); fill: none; stroke-width: 2.8; stroke-linejoin: round; stroke-linecap: round; }
    .p-fill {
      stroke: var(--bello-accent, #C4502C); fill: none; stroke-width: 4.6;
      stroke-linejoin: round; stroke-linecap: round; opacity: .92;
      stroke-dasharray: 100 150; stroke-dashoffset: 101;
      animation: p-draw 3.6s linear infinite;
    }
    @keyframes p-draw {
      0%, 4%    { stroke-dashoffset: 101; opacity: .92; }
      72%       { stroke-dashoffset: 0; opacity: .92; }
      86%       { stroke-dashoffset: 0; opacity: .92; }
      94%, 99.9%{ stroke-dashoffset: 0; opacity: 0; }
      100%      { stroke-dashoffset: 101; opacity: .92; }
    }
    .p-barA { animation: p-bA 0.64s steps(1, end) infinite; }
    .p-barB { animation: p-bB 0.64s steps(1, end) infinite; }
    @keyframes p-bA { 0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes p-bB { 0%, 49.9% { opacity: 0; } 50%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .p-fill, .p-barA, .p-barB { animation: none; }
      .p-fill { stroke-dasharray: none; stroke-dashoffset: 0; }
      .p-barB { opacity: 0; }
    }
  </style>
  <path class="p-bar p-barA" d="M19 52.6 C44 51 78 51.4 101 52.4 C102.8 56.5 103 62.5 101.6 66.8 C76 68.4 44 68 19.4 67.2 C17.4 63 17.2 56.8 19 52.6 Z"/>
  <path class="p-bar p-barB" d="M19.5 53.2 C45 51.8 77 50.8 100.6 52.9 C102.2 57.2 102.4 63 101.2 66.3 C77 67.8 45 68.6 19.8 66.7 C18 62.4 17.8 57 19.5 53.2 Z"/>
  <path class="p-fill" pathLength="100"
        d="M23.5 63.8 L26.5 56 L29 64 L33 55.8 L35.6 64.2 L40 55.6 L42.8 64.4 L47 56 L49.6 64.2 L54 55.7 L56.8 64.4 L61 55.9 L63.6 64.1 L68 55.6 L70.8 64.4 L75 56 L77.6 64.2 L82 55.8 L84.8 64.3 L89 55.9 L91.6 64 L95.5 56.2 L97.4 63.6"/>
</svg>
